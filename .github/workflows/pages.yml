name: Deploy documentation to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Validate static site files
        run: |
          test -s docs/index.html
          test -s docs/styles.css
          test -s docs/app.js
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path

          class Validator(HTMLParser):
              pass

          html = Path("docs/index.html").read_text(encoding="utf-8")
          parser = Validator()
          parser.feed(html)
          parser.close()
          for required in ('id="overview"', 'id="architecture"', 'id="console"', 'id="build"', 'src="./app.js"', 'href="./styles.css"'):
              assert required in html, f"Missing page element: {required}"
          js = Path("docs/app.js").read_text(encoding="utf-8")
          for command in ("help", "status", "version", "modules", "memory"):
              assert command in js, f"Missing demo command: {command}"
          print("Static site validation passed.")
          PY
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4